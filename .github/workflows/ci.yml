# Quality gates for every pull request and every push to main (spec: Continuous integration
# quality gates; ADR-0006). Actions are pinned by commit SHA; Dependabot keeps them current.
name: CI
# Docs-only follow-up pushes to a pull request skip the code gates: see the `changes` job.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Decides whether the code gates must run. They are skipped only for a follow-up push to an open
  # pull request that touches nothing but OpenSpec planning and docs (an OpenSpec archive commit),
  # and only when the commit before it passed every gate. A gate skipped by `if:` counts as passed
  # for the required checks. Anything else (new pull requests, force pushes, pushes to main, code,
  # docs/design, which the frontend tests read) runs everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ] && [ "$ACTION" = synchronize ] \
            && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
            && git merge-base --is-ancestor "$BEFORE" "$HEAD"; then
            changed=$(git diff --name-only "$BEFORE" "$HEAD")
            code_files=$(printf '%s\n' "$changed" | grep -Ev '^(openspec|docs)/' | grep -v '^$' || true)
            design_docs=$(printf '%s\n' "$changed" | grep -E '^docs/design/' || true)
            if [ -z "$code_files" ] && [ -z "$design_docs" ]; then
              # The latest run of each gate on the previous commit: passed, or itself skipped by
              # this rule (which needed a passed commit before it).
              passed=$(gh api "repos/${REPO}/commits/${BEFORE}/check-runs?per_page=100" --jq '
                [.check_runs[] | select(.name == "backend" or .name == "frontend" or .name == "e2e" or .name == "images")]
                | group_by(.name) | map(max_by(.started_at))
                | map(select(.conclusion == "success" or .conclusion == "skipped")) | length')
              if [ "$passed" = 4 ]; then
                code=false
              fi
            fi
          fi
          echo "Code gates run: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The Testcontainers suite with coverage takes about 20 minutes on a hosted runner.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: backend/global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
      - name: Restore (fails on high/critical vulnerabilities)
        run: dotnet restore PolvorApp.slnx
      - name: Format
        run: dotnet format PolvorApp.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build PolvorApp.slnx --configuration Release --no-restore
      - name: Contract drift (commit the regenerated contracts/openapi.json)
        run: |
          git status --porcelain -- ../contracts
          test -z "$(git status --porcelain -- ../contracts)"
      - name: Test with coverage (Testcontainers)
        run: >
          dotnet test --solution PolvorApp.slnx --configuration Release --no-build
          --coverlet --coverlet-output-format cobertura
          --coverlet-include "[PolvorApp.*]*" --coverlet-exclude "[*Tests]*"
          --results-directory TestResults
      - name: Coverage gate (80 % lines)
        run: node ../scripts/check-coverage.mjs TestResults 80
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-coverage
          path: backend/TestResults/**/*.xml
          if-no-files-found: ignore

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit runtime dependencies (high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Translations
        run: npm run check-i18n
      - name: Test with coverage (80 % gate)
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Build the component catalogue (Storybook)
        run: npm run build-storybook

  # Runs beside the backend and frontend gates (it builds its own images); publishing still waits for
  # every gate.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the compose stack with the example settings, installing Playwright meanwhile
        run: |
          cp .env.example .env
          # The whole suite signs in from one address: raise the per-address sign-in limits.
          echo "RATE_LIMIT_AUTH_PER_MINUTE=300" >> .env
          echo "RATE_LIMIT_AUTH_EMAIL_PER_15_MINUTES=100" >> .env
          echo "RATE_LIMIT_PERSONAL_DATA_WRITES_PER_MINUTE=600" >> .env
          echo "RATE_LIMIT_IMAGE_UPLOADS_PER_MINUTE=200" >> .env
          echo "RATE_LIMIT_SPREADSHEET_IMPORTS_PER_MINUTE=100" >> .env
          echo "RATE_LIMIT_EXPORTS_PER_MINUTE=300" >> .env
          echo "RATE_LIMIT_PRIVACY_PER_MINUTE=100" >> .env
          echo "RATE_LIMIT_INSIGHTS_READS_PER_MINUTE=600" >> .env
          # Notification emails every 2 s, so the E2E run reads them in Mailpit without waiting long.
          echo "NOTIFICATIONS_DISPATCH_INTERVAL_SECONDS=2" >> .env
          # Building the images and installing the browsers are independent: run them side by side.
          docker compose up --detach --build --wait > "$RUNNER_TEMP/compose-up.log" 2>&1 &
          compose=$!
          installed=0
          (cd frontend && npm ci && npx playwright install --with-deps chromium firefox webkit) || installed=$?
          started=0
          wait "$compose" || started=$?
          echo "::group::docker compose up"
          cat "$RUNNER_TEMP/compose-up.log"
          echo "::endgroup::"
          if [ "$installed" -ne 0 ] || [ "$started" -ne 0 ]; then
            echo "Playwright install exit code: $installed; compose up exit code: $started"
            exit 1
          fi
          # The E2E specs rely on the scenarios dataset (fixed counts and rows on the first page).
          SEED_DATASET=Scenarios docker compose run --rm api-seed
      - name: Playwright
        working-directory: frontend
        run: npm run e2e
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  # Builds both images on every run (no registry access), beside the other gates.
  images:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Publishes to GHCR only from main, after every gate passed; the only job with packages: write.
  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e, images, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Registry owner (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.OWNER }}/polvorapp-api:sha-${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/polvorapp-api:main
          cache-from: type=gha,scope=api
      - name: Web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/polvorapp-web:sha-${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/polvorapp-web:main
          cache-from: type=gha,scope=web

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${archive}$" | sha256sum --check
          tar -xzf "${archive}" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
