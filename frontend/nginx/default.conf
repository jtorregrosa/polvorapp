# Web entry point (ADR-0006, ADR-0011): serves the SPA and proxies /api to the API on the same
# origin, so cookies stay first-party. TLS and HSTS belong to the production reverse proxy.
# Access log without query strings: invitation and password-reset links carry one-time tokens.
log_format polvorapp '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    access_log /var/log/nginx/access.log polvorapp;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # API: the API sets its own security headers; nginx adds none here.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # nginx is the outermost proxy locally: never forward client-supplied X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 10m;
    }

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Files that must be revalidated so updates reach users.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # SPA: unknown paths render index.html; the client router shows its not-found page.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
