# Local environment only (ADR-0006) — not a deployment recipe (Development mode, placeholder
# credentials). Requires .env: `cp .env.example .env && docker compose up --build`.
# UI and API on http://localhost:8080; ports bind to loopback only.
name: polvorapp

services:
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    # MinIO no longer publishes community images; Chainguard's source-built image (bootstrap-platform design D3).
    # No healthcheck: the image has no shell or client. The migrate command waits for it (up to 30 s)
    # and creates the bucket; the API's readiness check covers it afterwards.
    image: cgr.dev/chainguard/minio@sha256:4692462f35d97d7e82c30371d82f057703c5d9489bcae726010594c812f2d285
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mail:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies every module's migrations, then exits (migrations never run on web startup).
  api-migrate:
    build: &api-build
      context: backend
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0-local}
        GIT_COMMIT: ${GIT_COMMIT:-local}
    command: ["migrate"]
    environment: &api-environment
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Postgres: Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # Transactional email goes to the Mailpit catcher; links point at the web entry point.
      Email__SmtpHost: mail
      Email__SmtpPort: "1025"
      Email__Security: None
      Email__From: ${EMAIL_FROM:-no-reply@polvorapp.example}
      App__PublicBaseUrl: http://localhost:${WEB_PORT:-8080}
      # nginx on the compose network is the only proxy whose X-Forwarded-For is trusted.
      ForwardedHeaders__KnownNetworks: 172.28.0.0/24
      # Sign-in rate limits per client address; the E2E run raises them (docs/development.md).
      RateLimits__Auth__PermitLimit: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RateLimits__AuthEmail__PermitLimit: ${RATE_LIMIT_AUTH_EMAIL_PER_15_MINUTES:-5}
      # Registry and photo writes per user and minute; the E2E run raises it (one shared Admin).
      RateLimits__PersonalDataWrites__PermitLimit: ${RATE_LIMIT_PERSONAL_DATA_WRITES_PER_MINUTE:-60}
      # Image uploads that the server decodes (comparsa logos) per user and minute.
      RateLimits__ImageUploads__PermitLimit: ${RATE_LIMIT_IMAGE_UPLOADS_PER_MINUTE:-20}
      # Spreadsheet imports that the server reads (arquebusier import) per user and minute.
      RateLimits__SpreadsheetImports__PermitLimit: ${RATE_LIMIT_SPREADSHEET_IMPORTS_PER_MINUTE:-10}
      # Comparsa order writes (entries, loans, submission, review) per user and minute.
      RateLimits__OrderWrites__PermitLimit: ${RATE_LIMIT_ORDER_WRITES_PER_MINUTE:-120}
      RateLimits__Exports__PermitLimit: ${RATE_LIMIT_EXPORTS_PER_MINUTE:-30}
      # How often notification emails are sent (add-notifications); the E2E run shortens it.
      Notifications__DispatchIntervalSeconds: ${NOTIFICATIONS_DISPATCH_INTERVAL_SECONDS:-30}
      # Private photo bucket (ADR-0005). Locally the API uses the MinIO root credentials; real
      # environments use a key limited to this bucket (docs/development.md).
      Storage__ServiceUrl: http://storage:9000
      Storage__Bucket: ${STORAGE_BUCKET:-polvorapp-photos}
      Storage__AccessKey: ${MINIO_ROOT_USER}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # One-shot, on demand: `docker compose run --rm api-seed`. Only this container gets the seed
  # credentials (placeholders for local use; the seeder refuses them outside Development).
  api-seed:
    build: *api-build
    profiles: ["seed"]
    command: ["seed"]
    environment:
      <<: *api-environment
      Seed__UserPassword: ${SEED_USER_PASSWORD:-local-only-seed-password}
      Seed__AuthenticatorKey: ${SEED_AUTHENTICATOR_KEY:-JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP}
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      storage:
        condition: service_started
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build: *api-build
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
      mail:
        condition: service_healthy
      storage:
        condition: service_started
    restart: unless-stopped
    # The chiseled image has no shell or HTTP client; web's healthcheck covers the API.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_started
    # Through nginx to the API readiness check: healthy only when web, API and database all work.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# A fixed subnet, so the API trusts X-Forwarded-For only from this network (nginx).
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  db-data:
  storage-data:
